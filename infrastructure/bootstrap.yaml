AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Onward Logistics order system bootstrap. Things that must exist before the
  application pipeline or the ECS service can run: the ECR repository, the
  GitHub OIDC provider, and the role GitHub Actions assumes to push images.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  GitHubOwner:
    Type: String
    Default: effienjoki
  AppRepoName:
    Type: String
    Default: onward-orders-app
  GitHubOwnerId:
    Type: String
    Description: Immutable GitHub account ID, as it appears in the OIDC token subject.
  AppRepoId:
    Type: String
    Description: Immutable GitHub repository ID, as it appears in the OIDC token subject.
  InfraRepoName:
    Type: String
    Default: onward-orders-infrastructure
  InfraRepoId:
    Type: String
    Description: Immutable GitHub ID of the infrastructure repository.
  DeployRoleArn:
    Type: String
    Description: Existing CloudFormation service role that builds the infrastructure (bootstrap exception).
  CreateGitHubOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set to false if the GitHub OIDC provider already exists in this account.

Conditions:
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, 'true']

Resources:

  # ---------- ECR repository: where the order images live ----------

  OrdersRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub onward-${Environment}-orders
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Delete untagged images after 1 day",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep only the 10 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # ---------- GitHub OIDC provider: AWS trusts GitHub's tokens ----------

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # ---------- What GitHub Actions may do: push to this one repository ----------

  GitHubEcrPushPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Push images to the Onward orders ECR repository only.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: GetLoginToken
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: PushToOrdersRepositoryOnly
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Resource: !GetAtt OrdersRepository.Arn

  # ---------- The role GitHub Actions assumes with OIDC ----------

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by GitHub Actions in the app repo main branch, via OIDC, to push images.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub repo:${GitHubOwner}@${GitHubOwnerId}/${AppRepoName}@${AppRepoId}:ref:refs/heads/main
      ManagedPolicyArns:
        - !Ref GitHubEcrPushPolicy
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-github-ecr-push-role


  # ---------- Templates bucket: child templates for the nested stacks ----------

  TemplatesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub onward-${Environment}-orders-templates-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldTemplateVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  # ---------- What the infrastructure pipeline may do ----------

  InfraDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Upload child templates and deploy the Onward ECS stacks through the CloudFormation deploy role.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: UploadTemplates
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource: !Sub ${TemplatesBucket.Arn}/*
          - Sid: ReadTemplatesBucket
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource: !GetAtt TemplatesBucket.Arn
          - Sid: DeployOnwardEcsStacksOnly
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:GetTemplate
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
            Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/onward-${Environment}-ecs*/*
          - Sid: ReadTemplateDetails
            Effect: Allow
            Action:
              - cloudformation:ValidateTemplate
              - cloudformation:GetTemplateSummary
            Resource: '*'
          - Sid: HandDeployRoleToCloudFormationOnly
            Effect: Allow
            Action: iam:PassRole
            Resource: !Ref DeployRoleArn
            Condition:
              StringEquals:
                iam:PassedToService: cloudformation.amazonaws.com

  # ---------- The role the infrastructure repo's GitHub Actions assumes ----------

  InfraActionsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by GitHub Actions in the infrastructure repo main branch, via OIDC, to deploy the nested stacks.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub repo:${GitHubOwner}@${GitHubOwnerId}/${InfraRepoName}@${InfraRepoId}:ref:refs/heads/main
      ManagedPolicyArns:
        - !Ref InfraDeployPolicy
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-github-infra-deploy-role

Outputs:
  RepositoryName:
    Value: !Ref OrdersRepository
    Export:
      Name: !Sub onward-${Environment}-orders-bootstrap-RepositoryName
  RepositoryUri:
    Value: !GetAtt OrdersRepository.RepositoryUri
    Export:
      Name: !Sub onward-${Environment}-orders-bootstrap-RepositoryUri
  RepositoryArn:
    Value: !GetAtt OrdersRepository.Arn
    Export:
      Name: !Sub onward-${Environment}-orders-bootstrap-RepositoryArn
  GitHubActionsRoleArn:
    Description: Put this in the app repo as a GitHub variable (not a secret, it is not sensitive).
    Value: !GetAtt GitHubActionsRole.Arn
  TemplatesBucketName:
    Description: Where the infrastructure workflow uploads child templates.
    Value: !Ref TemplatesBucket
  InfraActionsRoleArn:
    Description: Put this in the infrastructure repo as the GitHub variable AWS_INFRA_ROLE_ARN.
    Value: !GetAtt InfraActionsRole.Arn